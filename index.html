<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Información legal y soporte de PeixeScan." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>PeixeScan Legal</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top center, rgba(196, 220, 239, 0.5), transparent 420px),
          #f4f8fc;
        color: #52677c;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      main {
        width: min(100%, 560px);
        text-align: center;
      }

      .brand {
        display: flex;
        justify-content: center;
      }

      .brand img {
        display: block;
        width: min(320px, 80vw);
        height: auto;
        object-fit: contain;
      }

      .legal-links {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px 22px;
        margin-top: 28px;
        font-size: 0.88rem;
        line-height: 1.5;
      }

      .legal-links a {
        color: #52677c;
        text-decoration: none;
        text-underline-offset: 3px;
      }

      .legal-links a:hover {
        color: #174f78;
        text-decoration: underline;
      }

      a:focus-visible {
        border-radius: 4px;
        outline: 3px solid rgba(23, 79, 120, 0.35);
        outline-offset: 4px;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 class="sr-only">Información legal de PeixeScan</h1>
      <header class="brand">
        <a href="https://peixescan.com/" aria-label="Ir a PeixeScan">
          <img src="assets/logo.png" alt="PeixeScan" />
        </a>
      </header>
      <nav class="legal-links" aria-label="Páginas legales y soporte">
        <a href="/privacy/">Política de privacidad</a>
        <a href="/terms/">Términos de uso</a>
        <a href="/delete-account/">Eliminar cuenta</a>
        <a href="/attributions/">Atribuciones y fuentes</a>
        <a href="/support/">Soporte</a>
      </nav>
    </main>
  </body>
</html>
